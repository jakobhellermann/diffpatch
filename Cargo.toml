[package]
name = "diffpatch"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
walkdir = "2.5"
diffy = "0.4"
nu-ansi-term = "0.50"
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
diffy = { git = "https://github.com/jakobhellermann/diffy", branch = "dev" }

[lints.clippy]
bool_comparison = "allow"
